# Сервіс web. Поля replicas немає: кількість задає kubectl scale або HPA.
apiVersion: v1
kind: ConfigMap
metadata:
  name: web-config
  namespace: lab3
data:
  DB_HOST: db
  DB_PORT: "5432"
  DB_NAME: admissions
  DB_USER: admissions
  DB_POOL_SIZE: "5"            # розмір пулу з варіанта лабораторної 2
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: lab3
spec:
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      terminationGracePeriodSeconds: 15
      containers:
        - name: web
          image: admissions-web:lab3
          imagePullPolicy: IfNotPresent   # образ імпортується в кластер командою k3d image import
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: web-config
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: POSTGRES_PASSWORD
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          resources:
            requests:
              cpu: 250m
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            timeoutSeconds: 3
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /livez, port: http}
            timeoutSeconds: 3
            periodSeconds: 10
            failureThreshold: 3
          lifecycle:
            preStop:
              sleep:
                seconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: lab3
spec:
  type: NodePort
  selector:
    app: web
  ports:
    - name: http
      port: 8000
      targetPort: http
      nodePort: 30080
